[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-codesign"
version = "0.13.0"
description = "Interactive robot structure, path, control and SVD co-design framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_codesign*", "webapp*"]
exclude = ["tests*", "tests_webapp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "tests_webapp"]

[tool.vercel]
entrypoint = "webapp.app:app"
